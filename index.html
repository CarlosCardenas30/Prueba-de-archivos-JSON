<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carta de bienvenida</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f3f4f6;
      margin: 0;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .carta-container {
      background-color: #ffffff;
      max-width: 650px;
      width: 100%;
      padding: 50px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
      border-top: 6px solid #111827;
    }

    .header-empresa {
      text-align: center;
      margin-bottom: 40px;
    }

    .logo {
      height: auto;
      max-height: 140px;      
      width: auto;            
      max-width: 100%;        
      object-fit: contain;    
      margin: 0 auto 15px auto; 
      display: block;         
    }

    .nombre-empresa {
      font-size: 22px;
      font-weight: 700;
      color: #111827;
      margin: 0;
    }
    .eslogan-empresa {
      font-size: 14px;
      color: #6b7280;
      font-style: italic;
      margin: 4px 0 0 0;
    }

    .meta-datos {
      border-top: 1px solid #e5e7eb;
      border-bottom: 1px solid #e5e7eb;
      padding: 15px 0;
      margin-bottom: 30px;
      font-size: 14px;
      color: #4b5563;
      display: flex;
      justify-content: space-between;
    }
    .meta-datos strong {
      color: #111827;
    }

    .saludo {
      font-size: 16px;
      font-weight: 600;
      color: #1f2937;
      margin-bottom: 20px;
    }
    .parrafo-contenido {
      font-size: 16px;
      color: #374151;
      line-height: 1.7;
      margin-bottom: 16px;
      text-align: justify;
    }

    .firma-seccion {
      margin-top: 40px;
      text-align: right;
      padding-bottom: 20px;
    }
    .despedida {
      font-size: 14px;
      font-weight: 600;
      color: #6b7280;
      margin-bottom: 30px;
    }
    .remitente {
      font-size: 16px;
      font-weight: 700;
      color: #111827;
    }

    .pie-pagina-corporativo {
      margin-top: 30px;
      border-top: 1px solid #e5e7eb;
      padding-top: 20px;
      font-size: 12px;
      color: #9ca3af;
      text-align: center;
      line-height: 1.6;
    }
    .pie-pagina-corporativo div {
      margin-bottom: 4px;
    }

    @media (max-width: 600px) {
      .logo {
        max-height: 100px;    
        margin-bottom: 10px;
      }
      .carta-container {
        padding: 30px 20px;   
      }
      .meta-datos {
        flex-direction: column;
        gap: 8px;
      }
      .firma-seccion {
        text-align: center;
      }
    }
  </style>
</head>
<body>

  <div class="carta-container">
    <header class="header-empresa">
      <img id="logo" class="logo" src="" alt="Cargando logotipo...">
      <h2 id="empresa" class="nombre-empresa"></h2>
      <p id="eslogan" class="eslogan-empresa"></p>
    </header>

    <div class="meta-datos">
      <div>Para: <strong id="destinatario"></strong></div>
      <div>Fecha: <strong id="fecha"></strong></div>
    </div>

    <main>
      <div id="saludo" class="saludo"></div>
      <div id="cuerpo-mensaje"></div>
    </main>

    <footer class="firma-seccion">
      <div id="despedida" class="despedida"></div>
      <div id="remitente" class="remitente"></div>
    </footer>

    <div class="pie-pagina-corporativo">
      <div id="pie-empresa" style="font-weight: bold; color: #6b7280; font-size: 13px;"></div>
      <div id="pie-direccion"></div>
      <div>
        <span id="pie-telefono"></span> | 
        <span id="pie-email"></span> | 
        <span id="pie-web"></span>
      </div>
    </div>
  </div>

  <script>
    fetch('carta.json')
      .then(response => {
        if (!response.ok) {
          throw new Error('No se pudo cargar el archivo JSON');
        }
        return response.json();
      })
      .then(data => {
        document.title = data.tituloPagina;

        document.getElementById('logo').src = data.datosEmpresa.logotipo.ruta;
        document.getElementById('logo').alt = data.datosEmpresa.logotipo.textoAlternativo;
        document.getElementById('empresa').innerText = data.datosEmpresa.empresa;
        document.getElementById('eslogan').innerText = data.datosEmpresa.eslogan;

        document.getElementById('destinatario').innerText = data.cartaBienvenida.destinatario;
        document.getElementById('fecha').innerText = data.cartaBienvenida.fecha;
        document.getElementById('saludo').innerText = data.cartaBienvenida.saludo;
        document.getElementById('despedida').innerText = data.cartaBienvenida.despedida;
        document.getElementById('remitente').innerText = data.cartaBienvenida.remitente;

        document.getElementById('pie-empresa').innerText = data.datosEmpresa.empresa;
        document.getElementById('pie-direccion').innerText = data.piePagina.direccion;
        document.getElementById('pie-telefono').innerText = "Tel: " + data.piePagina.telefono;
        document.getElementById('pie-email').innerText = data.piePagina.email;
        document.getElementById('pie-web').innerText = data.piePagina.web;

        const cuerpoContainer = document.getElementById('cuerpo-mensaje');
        data.cartaBienvenida.contenido.forEach(textoParrafo => {
          const p = document.createElement('p');
          p.className = 'parrafo-contenido';
          p.innerText = textoParrafo;
          cuerpoContainer.appendChild(p);
        });
      })
      .catch(error => {
        console.error('Error:', error);
      });
  </script>
</body>
</html>
